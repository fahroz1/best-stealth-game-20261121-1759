<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Courier — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; }
  body { display: grid; place-items: center; }
  #game {
    display: block;
    width: min(100vw, calc(100vh * 1280 / 720));
    height: auto;
    aspect-ratio: 1280 / 720;
    background: #0d0d18;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Midnight Courier: sneak through the guarded manor, gather three wax seals and reach the study exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
